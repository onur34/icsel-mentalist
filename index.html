<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İçsel Mentalist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --zemin: #EEF4EA;
            --kart: #FFFFFF;
            --kenar: #D5E3CC;
            --metin: #2F4A33;
            --metin-soluk: #5F7D60;
            --ipucu: #8FAA90;
            --vurgu: #4A8450;
            --vurgu-koyu: #3F7A48;
            --vurgu-acik: #C5DDB9;
            --hata: #B4452F;
            --serif: 'Lora', Georgia, serif;
            --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: var(--zemin);
            color: var(--metin);
            font-family: var(--sans);
            transition: background-color 1.5s ease-in-out, color 1.5s ease-in-out;
        }

        body.koyu-zemin { --metin: #F1F5EE; --metin-soluk: #D5E3CC; --ipucu: #C5DDB9; }
        body.koyu-zemin .card-disi { color: var(--metin); }

        button { font-family: inherit; cursor: pointer; }
        button:focus-visible, textarea:focus-visible, input:focus-visible {
            outline: 2px solid var(--vurgu);
            outline-offset: 2px;
        }

        .container { width: 100%; max-width: 680px; margin: 0 auto; padding: 56px 20px 20px; }

        .baslik { text-align: center; margin-bottom: 28px; }
        .baslik h1 {
            font-family: var(--serif);
            font-weight: 500;
            font-size: 32px;
            letter-spacing: 0.5px;
            margin: 0 0 6px;
            color: var(--metin);
            transition: color 1.5s ease;
        }
        .selamlama { margin: 0; font-size: 15px; color: var(--metin-soluk); transition: color 1.5s ease; }

        .ruh-hali { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 14px; }
        .chip {
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid var(--kenar);
            background: var(--kart);
            color: var(--metin-soluk);
            font-size: 13px;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .chip:hover { border-color: var(--vurgu); }
        .chip[aria-pressed="true"] { background: var(--vurgu-acik); border-color: var(--vurgu-acik); color: #2F4A33; font-weight: 500; }

        .yazi-alani { position: relative; }
        textarea {
            width: 100%;
            height: 220px;
            background: var(--kart);
            color: #2F4A33;
            border: 1px solid var(--kenar);
            border-radius: 16px;
            padding: 20px 20px 36px;
            font-family: var(--serif);
            font-size: 17px;
            line-height: 1.75;
            resize: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        textarea::placeholder { color: var(--ipucu); }
        textarea:focus { outline: none; border-color: var(--vurgu); box-shadow: 0 0 0 3px rgba(74, 132, 80, 0.15); }
        .sayac { position: absolute; right: 16px; bottom: 10px; font-size: 12px; color: var(--ipucu); pointer-events: none; }

        .button-group { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
        .sol-butonlar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .btn { padding: 11px 22px; border-radius: 999px; font-size: 14px; font-weight: 500; border: 1px solid transparent; transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease; }
        .btn:active { transform: scale(0.98); }
        .btn-kaydet { background: var(--kart); color: var(--metin-soluk); border-color: var(--kenar); }
        .btn-kaydet:hover { border-color: var(--vurgu); color: #2F4A33; }
        .btn-cikis { background: transparent; color: var(--metin-soluk); padding-left: 12px; padding-right: 12px; }
        .btn-cikis:hover { text-decoration: underline; }
        .btn-analiz { background: var(--vurgu); color: #FFFFFF; padding-left: 28px; padding-right: 28px; }
        .btn-analiz:hover { background: var(--vurgu-koyu); }
        .btn-analiz:disabled { opacity: 0.7; cursor: wait; }

        .bilgi-mesaji {
            font-size: 13px;
            font-weight: 500;
            color: #2F4A33;
            background: var(--vurgu-acik);
            padding: 5px 12px;
            border-radius: 999px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .bilgi-mesaji.hata { background: #F7DCD5; color: var(--hata); }

        .sonuc-kutusu {
            display: none;
            background: var(--kart);
            border: 1px solid var(--kenar);
            border-left: 4px solid var(--vurgu);
            border-radius: 16px;
            padding: 22px 24px;
            margin-top: 28px;
            color: #2F4A33;
        }
        .sonuc-kutusu h3 { font-family: var(--serif); font-weight: 500; font-size: 19px; margin: 0 0 10px; }
        #analizMetni { margin: 0; font-family: var(--serif); font-size: 16px; line-height: 1.85; color: #3F5A43; white-space: pre-wrap; }
        #analizMetni.yukleniyor { font-style: italic; color: var(--metin-soluk); }

        .kitap-karti {
            display: none;
            margin-top: 20px;
            padding: 16px 18px;
            background: #EEF4EA;
            border: 1px solid var(--kenar);
            border-radius: 12px;
            color: #2F4A33;
        }
        .kitap-baslik { margin: 0 0 6px; font-size: 13px; color: #5F7D60; }
        .kitap-adi { margin: 0; font-family: var(--serif); font-size: 18px; font-weight: 500; color: #2F4A33; }
        .kitap-yazar { margin: 2px 0 0; font-size: 14px; color: #5F7D60; }
        .kitap-bolum { margin: 2px 0 0; font-size: 13px; color: #5F7D60; }
        .kitap-aciklama { margin: 10px 0 0; font-family: var(--serif); font-size: 15px; line-height: 1.7; color: #3F5A43; }

        .uyari-metni { width: 100%; text-align: center; font-size: 12px; line-height: 1.5; color: var(--metin-soluk); padding: 20px; margin-top: 40px; transition: color 1.5s ease; }

        #girisEkrani {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            background: var(--zemin);
            padding: 20px;
        }
        .giris-karti {
            width: 100%; max-width: 360px;
            background: var(--kart);
            border: 1px solid var(--kenar);
            border-radius: 20px;
            padding: 32px 28px;
            text-align: center;
        }
        .giris-karti h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0 0 4px; color: var(--metin); }
        .giris-karti p { margin: 0 0 22px; font-size: 14px; color: var(--metin-soluk); }
        .giris-karti input {
            width: 100%; padding: 13px 14px; margin-bottom: 12px;
            border-radius: 12px; border: 1px solid var(--kenar);
            background: #FAFCF8; color: #2F4A33; font-size: 15px; font-family: var(--sans);
        }
        .giris-karti input::placeholder { color: var(--ipucu); }
        .giris-karti input:focus { outline: none; border-color: var(--vurgu); box-shadow: 0 0 0 3px rgba(74, 132, 80, 0.15); }
        .auth-butonlar { display: flex; gap: 10px; margin-top: 8px; }
        .auth-butonlar .btn { flex: 1; }
        .btn-giris { background: var(--vurgu); color: #fff; }
        .btn-giris:hover { background: var(--vurgu-koyu); }
        .btn-kayit { background: var(--kart); color: var(--metin-soluk); border-color: var(--kenar); }
        .btn-kayit:hover { border-color: var(--vurgu); color: #2F4A33; }
        #authMesaj { min-height: 20px; margin-top: 14px; color: var(--hata); font-size: 13px; font-weight: 500; }

        @media (max-width: 520px) {
            .container { padding-top: 36px; }
            .baslik h1 { font-size: 27px; }
            textarea { height: 200px; font-size: 16px; }
            .btn-analiz { width: 100%; }
            .button-group { flex-direction: column-reverse; align-items: stretch; }
            .sol-butonlar { justify-content: space-between; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="girisEkrani">
        <div class="giris-karti">
            <h2>İçsel Mentalist</h2>
            <p>Hesabınla giriş yap ya da yeni bir hesap oluştur.</p>
            <input type="email" id="emailInput" placeholder="ornek@mail.com" autocomplete="email">
            <input type="password" id="sifreInput" placeholder="Şifre" autocomplete="current-password">
            <div class="auth-butonlar">
                <button class="btn btn-giris" onclick="kimlikIslemi('/giris_yap')">Giriş yap</button>
                <button class="btn btn-kayit" onclick="kimlikIslemi('/kayit_ol')">Kayıt ol</button>
            </div>
            <div id="authMesaj" role="alert"></div>
        </div>
    </div>

    <!-- ANA UYGULAMA -->
    <div class="container" id="anaUygulama" style="display: none;">

        <div class="baslik">
            <h1 class="card-disi">İçsel Mentalist</h1>
            <p class="selamlama card-disi" id="selamlama">Bugün içinden neler geçti?</p>
        </div>

        <div class="ruh-hali" id="ruhHali" role="group" aria-label="Şu anki ruh halin">
            <button type="button" class="chip" aria-pressed="false">Huzurlu</button>
            <button type="button" class="chip" aria-pressed="false">Mutlu</button>
            <button type="button" class="chip" aria-pressed="false">Yorgun</button>
            <button type="button" class="chip" aria-pressed="false">Kaygılı</button>
            <button type="button" class="chip" aria-pressed="false">Üzgün</button>
            <button type="button" class="chip" aria-pressed="false">Öfkeli</button>
        </div>

        <div class="yazi-alani">
            <textarea id="gunlukMetni" placeholder="Buraya özgürce yaz…" aria-label="Günlük metni"></textarea>
            <span class="sayac" id="sayac">0 karakter</span>
        </div>

        <div class="button-group">
            <div class="sol-butonlar">
                <button class="btn btn-kaydet" onclick="kaydetTetikle()">Kaydet</button>
                <button class="btn btn-cikis" onclick="cikisYap()">Çıkış yap</button>
                <span id="kayitMesaji" class="bilgi-mesaji" role="status">Kaydedildi.</span>
            </div>
            <button class="btn btn-analiz" id="analizButonu" onclick="genelAnalizTetikle()">Beni dinle</button>
        </div>

        <div id="sonucAlani" class="sonuc-kutusu">
            <h3>Zihinsel örüntü raporu</h3>
            <p id="analizMetni"></p>

            <div class="kitap-karti" id="kitapOnerisi">
                <p class="kitap-baslik">Sana bir kitap önerisi</p>
                <p class="kitap-adi" id="kitapAdi"></p>
                <p class="kitap-yazar" id="kitapYazar"></p>
                <p class="kitap-bolum" id="kitapBolum"></p>
                <p class="kitap-aciklama" id="kitapAciklama"></p>
            </div>
        </div>
    </div>

    <div class="uyari-metni" id="footerUyari" style="display: none;">
        Bu analizler yapay zekâ (Gemini API) tarafından üretilir ve hata içerebilir. Profesyonel destek yerine geçmez.
    </div>

    <script>
        let seciliRuhHali = "";

        document.addEventListener("DOMContentLoaded", () => {
            const aktifId = localStorage.getItem("mentalist_user_id");
            const aktifEmail = localStorage.getItem("mentalist_user_email");
            if (aktifId && aktifEmail) { uygulamayiAc(); }

            ["emailInput", "sifreInput"].forEach(id => {
                document.getElementById(id).addEventListener("keydown", (e) => {
                    if (e.key === "Enter") kimlikIslemi('/giris_yap');
                });
            });

            const alan = document.getElementById('gunlukMetni');
            alan.addEventListener("input", () => {
                document.getElementById('sayac').innerText = alan.value.length + " karakter";
            });

            document.querySelectorAll("#ruhHali .chip").forEach(chip => {
                chip.addEventListener("click", () => {
                    const zatenSecili = chip.getAttribute("aria-pressed") === "true";
                    document.querySelectorAll("#ruhHali .chip").forEach(c => c.setAttribute("aria-pressed", "false"));
                    if (zatenSecili) {
                        seciliRuhHali = "";
                    } else {
                        chip.setAttribute("aria-pressed", "true");
                        seciliRuhHali = chip.innerText;
                    }
                });
            });

            const saat = new Date().getHours();
            let selam = "İyi akşamlar";
            if (saat < 6) selam = "İyi geceler";
            else if (saat < 12) selam = "Günaydın";
            else if (saat < 18) selam = "İyi günler";
            document.getElementById('selamlama').innerText = selam + ". Bugün içinden neler geçti?";
        });

        async function kimlikIslemi(endpoint) {
            const email = document.getElementById('emailInput').value.trim();
            const sifre = document.getElementById('sifreInput').value.trim();
            const mesajKutusu = document.getElementById('authMesaj');

            if (!email || !sifre) {
                mesajKutusu.innerText = "E-posta ve şifreni gir.";
                return;
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, sifre: sifre })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem("mentalist_user_id", data.kullanici_id);
                    localStorage.setItem("mentalist_user_email", data.email);
                    mesajKutusu.innerText = "";

                    document.getElementById('emailInput').value = "";
                    document.getElementById('sifreInput').value = "";

                    uygulamayiAc();
                } else {
                    const hata = await response.json();
                    mesajKutusu.innerText = hata.detail;
                }
            } catch (err) {
                mesajKutusu.innerText = "Sunucuya bağlanılamadı. Biraz sonra tekrar dene.";
            }
        }

        function uygulamayiAc() {
            document.getElementById('girisEkrani').style.display = 'none';
            document.getElementById('anaUygulama').style.display = 'block';
            document.getElementById('footerUyari').style.display = 'block';
        }

        function cikisYap() {
            localStorage.removeItem("mentalist_user_id");
            localStorage.removeItem("mentalist_user_email");
            location.reload();
        }

        function mesajGoster(metin, hata) {
            const mesaj = document.getElementById('kayitMesaji');
            mesaj.innerText = metin;
            mesaj.classList.toggle('hata', !!hata);
            mesaj.style.opacity = 1;
            setTimeout(() => { mesaj.style.opacity = 0; }, 4000);
        }

        function zeminiSifirla() {
            document.body.classList.remove("koyu-zemin");
            document.body.style.backgroundColor = "";
        }

        function renkKoyuMu(renk) {
            const ctx = document.createElement('canvas').getContext('2d');
            ctx.fillStyle = '#123456';
            ctx.fillStyle = renk;
            const sonuc = ctx.fillStyle;
            if (sonuc === '#123456' && renk.toLowerCase() !== '#123456') return null;

            let r, g, b;
            if (sonuc.startsWith('#')) {
                r = parseInt(sonuc.slice(1, 3), 16);
                g = parseInt(sonuc.slice(3, 5), 16);
                b = parseInt(sonuc.slice(5, 7), 16);
            } else {
                const m = sonuc.match(/\d+(\.\d+)?/g);
                if (!m) return null;
                r = +m[0]; g = +m[1]; b = +m[2];
            }
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.55;
        }

        /* ---------- GÖRSEL EFEKTLER ---------- */
        const azaltilmisHareket = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let aktifEfekt = null;

        function efektKatmani() {
            if (aktifEfekt) cancelAnimationFrame(aktifEfekt);
            let c = document.getElementById('efektKatmani');
            if (!c) {
                c = document.createElement('canvas');
                c.id = 'efektKatmani';
                c.setAttribute('aria-hidden', 'true');
                c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2000;';
                document.body.appendChild(c);
            }
            const dpr = window.devicePixelRatio || 1;
            c.width = window.innerWidth * dpr;
            c.height = window.innerHeight * dpr;
            c.style.display = 'block';
            const ctx = c.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return { c, ctx, w: window.innerWidth, h: window.innerHeight };
        }

        function efektiBitir(c, ctx, w, h) {
            ctx.clearRect(0, 0, w, h);
            c.style.display = 'none';
            aktifEfekt = null;
        }

        /* Kaydedince: ekran bir an gece gökyüzüne döner, yıldızlar kayar */
        function yildizKaymasi() {
            if (azaltilmisHareket) return;
            const { c, ctx, w, h } = efektKatmani();
            const SURE = 2600;
            const baslangic = performance.now();

            const kayanlar = Array.from({ length: 8 }, (_, i) => ({
                x: w * (0.35 + Math.random() * 0.8),
                y: -40 - Math.random() * h * 0.25,
                vx: -(750 + Math.random() * 450),
                vy: 380 + Math.random() * 260,
                uzunluk: 170 + Math.random() * 130,
                gecikme: i * 230 + Math.random() * 120
            }));

            const sabitler = Array.from({ length: 55 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: 0.8 + Math.random() * 1.8,
                faz: Math.random() * Math.PI * 2
            }));

            function kare(simdi) {
                const gecen = simdi - baslangic;
                if (gecen > SURE) { efektiBitir(c, ctx, w, h); return; }

                let zarf = 1;
                if (gecen < 350) zarf = gecen / 350;
                else if (gecen > SURE - 700) zarf = (SURE - gecen) / 700;

                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(18, 28, 48, ' + (0.5 * zarf) + ')';
                ctx.fillRect(0, 0, w, h);

                sabitler.forEach(y => {
                    const parilti = 0.35 + 0.65 * Math.abs(Math.sin(gecen / 380 + y.faz));
                    ctx.beginPath();
                    ctx.arc(y.x, y.y, y.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 244, 214, ' + (parilti * zarf) + ')';
                    ctx.fill();
                });

                kayanlar.forEach(k => {
                    const t = (gecen - k.gecikme) / 1000;
                    if (t < 0) return;
                    const hx = k.x + k.vx * t;
                    const hy = k.y + k.vy * t;
                    const hiz = Math.hypot(k.vx, k.vy);
                    const tx = hx - (k.vx / hiz) * k.uzunluk;
                    const ty = hy - (k.vy / hiz) * k.uzunluk;

                    const g = ctx.createLinearGradient(hx, hy, tx, ty);
                    g.addColorStop(0, 'rgba(255, 255, 255, 1)');
                    g.addColorStop(0.3, 'rgba(255, 224, 140, 0.7)');
                    g.addColorStop(1, 'rgba(255, 224, 140, 0)');
                    ctx.strokeStyle = g;
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(hx, hy);
                    ctx.lineTo(tx, ty);
                    ctx.stroke();

                    ctx.save();
                    ctx.shadowColor = 'rgba(255, 230, 150, 1)';
                    ctx.shadowBlur = 18;
                    ctx.beginPath();
                    ctx.arc(hx, hy, 3.4, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();
                    ctx.restore();
                });

                aktifEfekt = requestAnimationFrame(kare);
            }
            aktifEfekt = requestAnimationFrame(kare);
        }

        /* Analiz gelince: butondan ve iki köşeden konfeti patlar */
        function konfeti() {
            if (azaltilmisHareket) return;
            const { c, ctx, w, h } = efektKatmani();
            const renkler = ['#4A8450', '#2F6B3A', '#C5DDB9', '#F5B84B', '#E8A66B', '#F08A9B', '#6DB3E0', '#B9A5F0'];
            const parcalar = [];

            function patlat(x, y, aciMin, aciMax, adet, gecikme) {
                for (let i = 0; i < adet; i++) {
                    const aci = aciMin + Math.random() * (aciMax - aciMin);
                    const hiz = 450 + Math.random() * 650;
                    parcalar.push({
                        x, y,
                        vx: Math.cos(aci) * hiz,
                        vy: Math.sin(aci) * hiz,
                        boyut: 6 + Math.random() * 7,
                        renk: renkler[Math.floor(Math.random() * renkler.length)],
                        donus: Math.random() * Math.PI * 2,
                        donusHizi: (Math.random() - 0.5) * 12,
                        daire: Math.random() < 0.25,
                        dogum: gecikme
                    });
                }
            }

            const buton = document.getElementById('analizButonu');
            const r = buton.getBoundingClientRect();
            patlat(r.left + r.width / 2, r.top + r.height / 2, -Math.PI * 0.85, -Math.PI * 0.15, 110, 0);
            patlat(0, h, -Math.PI * 0.42, -Math.PI * 0.12, 70, 150);
            patlat(w, h, -Math.PI * 0.88, -Math.PI * 0.58, 70, 150);

            const SURE = 4200;
            const baslangic = performance.now();
            let onceki = baslangic;

            function kare(simdi) {
                const gecen = simdi - baslangic;
                const dt = Math.min((simdi - onceki) / 1000, 0.05);
                onceki = simdi;
                if (gecen > SURE) { efektiBitir(c, ctx, w, h); return; }

                ctx.clearRect(0, 0, w, h);
                parcalar.forEach(p => {
                    if (gecen < p.dogum) return;
                    p.vy += 1100 * dt;
                    p.vx *= 0.992;
                    p.vy *= 0.992;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.donus += p.donusHizi * dt;

                    const solma = gecen > SURE - 900 ? (SURE - gecen) / 900 : 1;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, solma);
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.donus);
                    ctx.fillStyle = p.renk;
                    if (p.daire) {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.boyut / 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillRect(-p.boyut / 2, -p.boyut / 4, p.boyut, p.boyut / 2);
                    }
                    ctx.restore();
                });
                aktifEfekt = requestAnimationFrame(kare);
            }
            aktifEfekt = requestAnimationFrame(kare);
        }

        async function kaydetTetikle() {
            const alan = document.getElementById('gunlukMetni');
            const metin = alan.value;
            const kullaniciId = localStorage.getItem("mentalist_user_id");
            if (!metin.trim()) return;

            const gonderilecek = seciliRuhHali ? "[Ruh hali: " + seciliRuhHali + "]\n" + metin : metin;

            try {
                const response = await fetch('/kaydet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kullanici_id: parseInt(kullaniciId), metin: gonderilecek })
                });
                if (!response.ok) throw new Error("kayit-hatasi");
            } catch (e) {
                mesajGoster("Kaydedilemedi. Tekrar dene.", true);
                return;
            }

            alan.value = "";
            document.getElementById('sayac').innerText = "0 karakter";
            document.querySelectorAll("#ruhHali .chip").forEach(c => c.setAttribute("aria-pressed", "false"));
            seciliRuhHali = "";
            zeminiSifirla();
            document.getElementById('sonucAlani').style.display = 'none';

            mesajGoster("Kaydedildi.", false);
            yildizKaymasi();
        }

        async function genelAnalizTetikle() {
            const sonucKutusu = document.getElementById('sonucAlani');
            const analizMetni = document.getElementById('analizMetni');
            const buton = document.getElementById('analizButonu');
            const kullaniciId = localStorage.getItem("mentalist_user_id");

            const bekleMesajlari = [
                "Geçmiş yazıların okunuyor…",
                "Tekrar eden örüntüler aranıyor…",
                "Ruh haline uygun bir renk seçiliyor…",
                "Sana bir kitap düşünülüyor…",
                "Neredeyse hazır, biraz daha sabır…"
            ];
            let mesajSirasi = 0;

            sonucKutusu.style.display = 'block';
            analizMetni.classList.add('yukleniyor');
            analizMetni.textContent = bekleMesajlari[0];
            buton.disabled = true;
            buton.textContent = "Dinliyorum…";
            document.getElementById('kitapOnerisi').style.display = 'none';

            const mesajDonguusu = setInterval(() => {
                mesajSirasi = Math.min(mesajSirasi + 1, bekleMesajlari.length - 1);
                analizMetni.textContent = bekleMesajlari[mesajSirasi];
            }, 4500);

            try {
                const response = await fetch('/genel_analiz/' + kullaniciId);
                if (!response.ok) throw new Error("analiz-hatasi");
                const veri = await response.json();

                analizMetni.classList.remove('yukleniyor');
                analizMetni.textContent = veri.analiz;

                if (veri.kitap) {
                    document.getElementById('kitapAdi').textContent = veri.kitap.kitap_adi;
                    document.getElementById('kitapYazar').textContent = veri.kitap.yazar;
                    document.getElementById('kitapBolum').textContent = veri.kitap.bolum ? "Bölüm: " + veri.kitap.bolum : "";
                    document.getElementById('kitapAciklama').textContent = veri.kitap.aciklama;
                    document.getElementById('kitapOnerisi').style.display = 'block';
                }

                if (veri.renk) {
                    const koyu = renkKoyuMu(veri.renk);
                    if (koyu !== null) {
                        document.body.style.backgroundColor = veri.renk;
                        document.body.classList.toggle("koyu-zemin", koyu);
                    }
                }

                if (!veri.yedek) konfeti();
            } catch (hata) {
                analizMetni.classList.remove('yukleniyor');
                analizMetni.textContent = "Gemini şu an meşgul. Birazdan tekrar dene.";
            } finally {
                clearInterval(mesajDonguusu);
                buton.disabled = false;
                buton.textContent = "Beni dinle";
            }
        }
    </script>
